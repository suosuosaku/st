<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,
body {
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  color: #f8edcf;
  font-family: "Noto Serif SC", "Microsoft YaHei UI", "Microsoft YaHei", serif;
}

button,
input,
textarea {
  font: inherit;
  letter-spacing: 0;
}

.eldred-welcome {
  --void: #070912;
  --night: #101827;
  --blue: #214f7a;
  --cyan: #43aeb1;
  --leaf: #6e9a59;
  --gold: #f0c668;
  --gold2: #b47a35;
  --wine: #913f55;
  --paper: #ead49f;
  --ink: #24170d;
  --line: rgba(239, 204, 123, 0.34);
  --soft: rgba(255, 255, 255, 0.075);
  --muted: #cfc2a4;
  width: min(1120px, calc(100vw - 16px));
  margin: 8px auto;
  box-sizing: border-box;
}

.eldred-welcome *,
.eldred-welcome *::before,
.eldred-welcome *::after {
  box-sizing: border-box;
}

.ew-frame {
  overflow: hidden;
  border: 1px solid var(--line);
  background:
    radial-gradient(circle at 18% 8%, rgba(67, 174, 177, 0.18), transparent 26%),
    radial-gradient(circle at 86% 10%, rgba(240, 198, 104, 0.18), transparent 24%),
    linear-gradient(135deg, rgba(7, 9, 18, 0.98), rgba(19, 28, 48, 0.98) 48%, rgba(53, 36, 62, 0.96));
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38), inset 0 0 0 1px rgba(255, 255, 255, 0.04);
}

.compact-frame {
  display: grid;
  gap: 16px;
  padding: 20px;
}

.ew-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 22px 26px 18px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(90deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.025));
}

.ew-title span,
.ew-hero span,
.ew-stage-head span,
.ew-card span,
.ew-summary span,
.ew-preview header span {
  color: var(--gold);
  font-size: 12px;
  font-weight: 900;
}

.ew-title h1 {
  margin: 6px 0 0;
  color: #fff4cc;
  font-size: 31px;
  line-height: 1.05;
}

.ew-title p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 13px;
  font-weight: 800;
}

.ew-seal {
  width: 62px;
  height: 62px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: #2b1608;
  font-size: 30px;
  font-weight: 1000;
  background: linear-gradient(135deg, #fff1af, var(--gold) 52%, #9f6728);
  clip-path: polygon(50% 0, 91% 24%, 91% 75%, 50% 100%, 9% 75%, 9% 24%);
  box-shadow: 0 0 0 8px rgba(240, 198, 104, 0.12);
}

.ew-board {
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr);
  min-height: 700px;
}

.ew-side {
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 16px;
  padding: 18px;
  border-right: 1px solid var(--line);
  background:
    linear-gradient(180deg, rgba(4, 8, 16, 0.86), rgba(19, 30, 47, 0.76)),
    linear-gradient(90deg, rgba(240, 198, 104, 0.08), transparent);
}

.ew-side-card,
.ew-info-grid article,
.ew-card,
.ew-preview,
.ew-summary div,
.ew-map {
  border: 1px solid rgba(239, 204, 123, 0.22);
  background: var(--soft);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
}

.ew-side-card {
  padding: 13px;
}

.ew-side-card b,
.ew-info-grid b,
.ew-card b,
.ew-preview b {
  color: #fff4cc;
}

.ew-side-card p,
.ew-info-grid p,
.ew-card p,
.ew-card small,
.ew-hero p {
  color: var(--muted);
  line-height: 1.65;
}

.ew-side-card p,
.ew-info-grid p,
.ew-card p {
  margin: 7px 0 0;
  font-size: 13px;
}

.ew-side-card.compact p {
  margin-top: 5px;
  font-size: 12px;
}

.ew-steps {
  display: grid;
  align-content: start;
  gap: 8px;
}

.ew-steps button {
  min-height: 52px;
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  grid-template-rows: auto auto;
  align-items: center;
  gap: 1px 9px;
  padding: 8px 10px;
  border: 1px solid rgba(239, 204, 123, 0.18);
  background: rgba(255, 255, 255, 0.055);
  color: #f6e6bd;
  text-align: left;
  cursor: pointer;
}

.ew-steps button span {
  grid-row: 1 / span 2;
  color: var(--gold);
  font-size: 12px;
  font-weight: 1000;
}

.ew-steps button strong {
  color: inherit;
  font-size: 15px;
}

.ew-steps button small {
  color: var(--muted);
  font-size: 11px;
}

.ew-steps button.active {
  background: linear-gradient(135deg, rgba(240, 198, 104, 0.98), rgba(255, 239, 177, 0.94));
  color: #261505;
}

.ew-steps button.active span,
.ew-steps button.active small {
  color: #67400f;
}

.ew-stage {
  min-width: 0;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.ew-stage-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  padding: 18px 22px 14px;
  border-bottom: 1px solid var(--line);
}

.ew-stage-head h2 {
  margin: 5px 0 0;
  color: #fff4cc;
  font-size: 28px;
  line-height: 1.12;
}

.ew-fast,
.ew-footer > div,
.ew-tone-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.ew-fast button,
.ew-footer button,
.ew-tone-row button {
  min-height: 34px;
  padding: 0 12px;
  border: 1px solid rgba(239, 204, 123, 0.22);
  background: rgba(255, 255, 255, 0.06);
  color: #f6e6bd;
  font-weight: 900;
  cursor: pointer;
}

.ew-footer button[disabled] {
  opacity: 0.42;
  cursor: default;
}

.ew-fast button:hover,
.ew-footer button:not([disabled]):hover,
.ew-tone-row button:hover,
.ew-card:hover,
.ew-node:hover {
  border-color: rgba(67, 174, 177, 0.78);
  box-shadow: 0 0 0 3px rgba(67, 174, 177, 0.1);
}

.ew-content {
  padding: 20px 22px;
}

.ew-stack {
  display: grid;
  gap: 16px;
}

.ew-hero {
  min-height: 260px;
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(260px, 0.75fr);
  gap: 20px;
  overflow: hidden;
  border: 1px solid rgba(239, 204, 123, 0.24);
  background:
    linear-gradient(135deg, rgba(16, 25, 43, 0.9), rgba(42, 50, 81, 0.7)),
    radial-gradient(circle at 72% 22%, rgba(67, 174, 177, 0.18), transparent 28%);
}

.ew-hero > div:first-child {
  padding: 26px;
}

.ew-hero h3 {
  margin: 12px 0;
  color: #fff6d2;
  font-size: 35px;
  line-height: 1.12;
}

.ew-orbit {
  position: relative;
  min-height: 235px;
  margin: 18px 18px 18px 0;
  border: 1px solid rgba(239, 204, 123, 0.28);
  background:
    linear-gradient(135deg, rgba(240, 198, 104, 0.12), rgba(67, 174, 177, 0.08)),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.065) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 34px);
}

.ew-orbit i {
  position: absolute;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 20px rgba(240, 198, 104, 0.55);
}

.ew-orbit i:nth-child(1) { left: 20%; top: 24%; }
.ew-orbit i:nth-child(2) { left: 64%; top: 30%; background: var(--cyan); }
.ew-orbit i:nth-child(3) { left: 48%; top: 62%; background: var(--leaf); }
.ew-orbit i:nth-child(4) { left: 76%; top: 72%; background: var(--wine); }

.ew-orbit strong {
  position: absolute;
  left: 22px;
  right: 22px;
  bottom: 20px;
  color: #fff6d2;
  font-size: 18px;
}

.ew-info-grid,
.ew-card-grid,
.ew-summary {
  display: grid;
  gap: 14px;
}

.ew-info-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.ew-info-grid article {
  padding: 15px;
}

.ew-card-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.ew-card-grid.three {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.ew-card {
  min-height: 132px;
  display: grid;
  align-content: start;
  gap: 9px;
  padding: 15px;
  cursor: pointer;
}

.ew-card div {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.ew-card small {
  font-size: 12px;
}

.ew-card.selected,
.ew-tone-row button.selected {
  border-color: rgba(67, 174, 177, 0.78);
  background: linear-gradient(135deg, rgba(67, 174, 177, 0.16), rgba(240, 198, 104, 0.08));
}

.ew-map {
  position: relative;
  min-height: 268px;
  overflow: hidden;
  background:
    radial-gradient(circle at 50% 50%, rgba(67, 174, 177, 0.13), transparent 44%),
    linear-gradient(135deg, rgba(11, 18, 31, 0.84), rgba(35, 49, 73, 0.6));
}

.ew-map::before {
  content: "";
  position: absolute;
  inset: 40px 70px;
  border: 1px dashed rgba(240, 198, 104, 0.36);
  transform: skew(-10deg);
}

.ew-node {
  position: absolute;
  width: 190px;
  min-height: 64px;
  display: grid;
  gap: 3px;
  padding: 10px 12px;
  border: 1px solid rgba(239, 204, 123, 0.22);
  background: rgba(5, 8, 15, 0.76);
  color: #fff4cc;
  text-align: left;
  cursor: pointer;
}

.ew-node span {
  color: var(--muted);
  font-size: 12px;
}

.ew-node.selected {
  border-color: rgba(240, 198, 104, 0.84);
  background: linear-gradient(135deg, rgba(240, 198, 104, 0.95), rgba(255, 239, 177, 0.9));
  color: #251405;
}

.ew-node.selected span {
  color: #67400f;
}

.n1 { left: 7%; top: 16%; }
.n2 { right: 12%; top: 18%; }
.n3 { left: 37%; top: 42%; }
.n4 { left: 13%; bottom: 14%; }
.n5 { right: 8%; bottom: 13%; }

.ew-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.ew-field {
  display: grid;
  gap: 7px;
}

.ew-field.wide {
  grid-column: 1 / -1;
}

.ew-field span {
  color: #ecdcb6;
  font-size: 12px;
  font-weight: 1000;
}

.ew-field input,
.ew-field textarea {
  width: 100%;
  border: 1px solid rgba(239, 204, 123, 0.25);
  background: rgba(0, 0, 0, 0.24);
  color: #fff4d3;
  padding: 11px 12px;
  outline: none;
  line-height: 1.55;
}

.ew-field textarea {
  min-height: 104px;
  resize: vertical;
}

.ew-field input:focus,
.ew-field textarea:focus {
  border-color: rgba(67, 174, 177, 0.76);
  box-shadow: 0 0 0 3px rgba(67, 174, 177, 0.12);
}

.ew-summary {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.ew-summary div {
  display: grid;
  gap: 6px;
  padding: 12px;
}

.ew-summary b {
  color: #fff4cc;
  overflow-wrap: anywhere;
}

.ew-preview {
  padding: 16px;
  background: linear-gradient(180deg, rgba(234, 212, 159, 0.98), rgba(207, 172, 104, 0.96));
  color: var(--ink);
}

.ew-preview header {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.ew-preview b {
  color: #5c3816;
}

.ew-preview pre {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #302113;
  font: 13px/1.68 "Noto Serif SC", "Microsoft YaHei", serif;
}

.ew-footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 22px 20px;
  border-top: 1px solid var(--line);
}

.ew-footer button.primary {
  background: linear-gradient(135deg, var(--gold), #fff0ae);
  color: #251606;
}

.ew-confirm-banner {
  padding: 20px;
  border: 1px solid rgba(239, 204, 123, 0.24);
  background: rgba(255, 255, 255, 0.075);
}

.ew-confirm-banner span {
  color: var(--gold);
  font-weight: 1000;
}

.ew-confirm-banner h2 {
  margin: 8px 0;
  color: #fff4cc;
}

.ew-confirm-banner p {
  margin: 0;
  color: var(--muted);
  line-height: 1.7;
}

@media (max-width: 900px) {
  .ew-board {
    grid-template-columns: 1fr;
  }

  .ew-side {
    border-right: 0;
    border-bottom: 1px solid var(--line);
  }

  .ew-steps {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .ew-hero,
  .ew-card-grid,
  .ew-card-grid.three,
  .ew-info-grid,
  .ew-form,
  .ew-summary {
    grid-template-columns: 1fr;
  }

  .ew-node {
    position: relative;
    left: auto;
    right: auto;
    top: auto;
    bottom: auto;
    width: auto;
  }

  .ew-map {
    display: grid;
    gap: 10px;
    padding: 14px;
  }

  .ew-map::before {
    display: none;
  }
}

@media (max-width: 560px) {
  .eldred-welcome {
    width: 100%;
    margin: 0;
  }

  .ew-title,
  .ew-stage-head,
  .ew-footer {
    display: grid;
  }

  .ew-content,
  .ew-title,
  .ew-stage-head,
  .ew-footer,
  .ew-side {
    padding-left: 14px;
    padding-right: 14px;
  }

  .ew-steps {
    grid-template-columns: 1fr;
  }

  .ew-hero h3 {
    font-size: 27px;
  }
}

</style>
</head>
<body>
  <div id="app"></div>

<script type="module">
(() => {
  const BUILD_ID = 'eldred-welcome-v3.2.3';
  const HOST_ID = globalThis.__ELDRED_WELCOME_HOST_ID__ || new URLSearchParams(window.location.search).get('hostId') || '';

  const pages = [
    { id: 'cover', title: '卷首', sub: '世界入口' },
    { id: 'origin', title: '出生点', sub: '第一幕落点' },
    { id: 'identity', title: '身份', sub: '角色模板' },
    { id: 'dossier', title: '档案', sub: '玩家设定' },
    { id: 'party', title: '同行', sub: '队伍边界' },
    { id: 'confirm', title: '确认', sub: '开局指令' },
  ];

  const places = [
    {
      id: '黎明城墙白冠西门',
      region: '神圣王国艾琳西亚',
      risk: '低',
      service: '城门登记 / 临时通行证 / 旅店询问',
      mood: '体制内盘查',
      hook: '第一场麻烦通常不是魔物，而是解释自己为什么没有像样文书。',
    },
    {
      id: '风车港城外码头',
      region: '岚之领七城邦',
      risk: '中',
      service: '船运 / 商队 / 行会委托',
      mood: '海风与账单',
      hook: '一张写错名字的货单，可能比贵族请柬更快把人卷进故事。',
    },
    {
      id: '灰雾边境营地',
      region: '禁忌之地边缘',
      risk: '高',
      service: '巡防 / 救治 / 禁物封存',
      mood: '边境危机',
      hook: '帐篷外的泥很新，伤员也很新，没人有空把麻烦说得体面。',
    },
    {
      id: '星砂学院邮驿站',
      region: '星砂学院邦',
      risk: '低',
      service: '邮驿 / 鉴定 / 学徒委托',
      mood: '实验事故',
      hook: '驿站永远有寄错的箱子，偶尔箱子还会自己发光。',
    },
    {
      id: '白冠城外市集',
      region: '艾琳西亚',
      risk: '中',
      service: '补给 / 雇佣 / 传闻打听',
      mood: '市井轻喜剧',
      hook: '晚饭钱和第一份委托会同时出现，但前者通常更急。',
    },
    {
      id: '自定义出生点',
      region: '玩家指定',
      risk: '待定',
      service: '按设定生成',
      mood: '自由接入',
      hook: '写地点、氛围或眼前麻烦即可，世界会把它接进当前规则。',
    },
  ];

  const identities = [
    ['旅行者', '行动自由，但缺少担保，开局要处理落脚、文书和第一份收入。'],
    ['见习冒险者', '懂一点行会规矩，容易接委托，也容易被老手低估。'],
    ['边境杂役', '熟悉营地、货车和低价补给，知道路上真正缺什么。'],
    ['流亡小贵族', '懂礼仪和旧关系，但姓氏可能比钱包更先带来麻烦。'],
    ['学院旁听生', '有知识入口，容易卷进实验事故、账单和导师的临时差遣。'],
    ['自定义身份', '只保留玩家填写的身份气质，不预设隐藏血统或救世使命。'],
  ];

  const partyModes = [
    ['暂时独行', '第一幕重点落在落脚、盘查、委托入口和本地 NPC 接触。'],
    ['可遇伙伴', '允许剧情自然出现可同行角色，但不强行入队。'],
    ['已有同行', '玩家可在角色设计里写明同行者，剧情负责给出合理登场。'],
  ];

  const tones = ['轻喜剧冒险', '城邦日常', '遗迹探索', '边境危机'];

  const state = {
    page: 'cover',
    place: places[0].id,
    identity: identities[0][0],
    party: partyModes[0][0],
    tone: tones[0],
    submitted: false,
    fields: {
      name: '{{user}}',
      customPlace: '',
      design: '',
      trouble: '',
      goal: '',
      note: '',
    },
  };

  function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, char => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;',
    })[char]);
  }

  function pageIndex() {
    return Math.max(0, pages.findIndex(page => page.id === state.page));
  }

  function currentPage() {
    return pages[pageIndex()] || pages[0];
  }

  function selectedPlace() {
    return places.find(place => place.id === state.place) || places[0];
  }

  function selectedIdentity() {
    return identities.find(identity => identity[0] === state.identity) || identities[0];
  }

  function selectedParty() {
    return partyModes.find(mode => mode[0] === state.party) || partyModes[0];
  }

  function actualPlaceName() {
    const custom = state.fields.customPlace.trim();
    return state.place === '自定义出生点' && custom ? custom : state.place;
  }

  function buildPrompt() {
    const place = selectedPlace();
    const identity = selectedIdentity();
    return [
      '【艾尔德雷德开局设定】',
      `玩家名: ${state.fields.name.trim() || '{{user}}'}`,
      `出生点: ${actualPlaceName()}`,
      `区域倾向: ${place.region}`,
      `地点服务: ${place.service}`,
      `地点风险: ${place.risk}`,
      `开场气质: ${place.mood}`,
      `角色模板: ${identity[0]}`,
      `模板边界: ${identity[1]}`,
      `角色设计: ${state.fields.design.trim() || '默认是纯路人，不预设隐藏身份，由玩家后续补充。'}`,
      `当前麻烦: ${state.fields.trouble.trim() || place.hook}`,
      `开局目标: ${state.fields.goal.trim() || '先进入当前地点的日常秩序，获得第一个可行动目标。'}`,
      `同行预案: ${state.party}`,
      `开局节奏: ${state.tone}`,
      `补充说明: ${state.fields.note.trim() || '无'}`,
      '生成要求: 根据以上角色设计和出生点自行设计第一幕剧情；不要使用固定开场白；输出必须遵守艾尔德雷德预设格式，正文使用<content>包裹，变量按MVU规则更新。',
    ].join('\n');
  }

  function post(type, payload = {}) {
    try {
      window.parent?.postMessage({ source: 'EldredWelcome', build: BUILD_ID, hostId: HOST_ID, type, ...payload }, '*');
    } catch (error) {}
  }

  function resizeSoon() {
    requestAnimationFrame(() => {
      const height = Math.max(
        document.documentElement.scrollHeight,
        document.body?.scrollHeight || 0,
        640,
      );
      post('resize', { height: height + 12 });
    });
  }

  function move(delta) {
    const next = Math.max(0, Math.min(pages.length - 1, pageIndex() + delta));
    state.page = pages[next].id;
    renderHome();
  }

  function fillSample() {
    state.page = 'confirm';
    state.place = places[0].id;
    state.identity = identities[0][0];
    state.party = partyModes[0][0];
    state.tone = tones[0];
    state.fields = {
      name: '{{user}}',
      customPlace: '',
      design: '看起来只是普通旅行者，背着磨旧的包，语气乐观，钱袋不算充足。',
      trouble: '没有能立刻证明身份的路引，但想进城找落脚处和第一份委托。',
      goal: '通过盘查，进入艾琳西亚，找到今晚能睡觉且不会太贵的地方。',
      note: '不要预设隐藏身份，玩家会在后续自己补充真实来历。',
    };
    renderHome();
  }

  function reset() {
    state.page = 'cover';
    state.place = places[0].id;
    state.identity = identities[0][0];
    state.party = partyModes[0][0];
    state.tone = tones[0];
    state.submitted = false;
    state.fields = { name: '{{user}}', customPlace: '', design: '', trouble: '', goal: '', note: '' };
    renderHome();
  }

  function submitToTavernInput(text) {
    const windows = [];
    try { windows.push(window.parent); } catch (error) {}
    try { windows.push(window.top); } catch (error) {}
    try { windows.push(window.opener); } catch (error) {}
    windows.push(window);
    const seen = new Set();
    for (const win of windows) {
      if (!win || seen.has(win)) continue;
      seen.add(win);
      try {
        const doc = win.document;
        if (!doc) continue;
        const selectors = ['#send_textarea', 'textarea#send_textarea', 'textarea[name="text"]', 'textarea'];
        for (const selector of selectors) {
          const candidates = Array.from(doc.querySelectorAll(selector));
          const target = candidates.find(node => {
            const rect = node.getBoundingClientRect();
            return rect.width > 0 && rect.height > 0;
          }) || candidates[0];
          if (!target) continue;
          const proto = target instanceof win.HTMLTextAreaElement
            ? win.HTMLTextAreaElement.prototype
            : win.HTMLInputElement?.prototype;
          const setter = proto && Object.getOwnPropertyDescriptor(proto, 'value')?.set;
          if (setter) setter.call(target, text);
          else target.value = text;
          target.dispatchEvent(new win.Event('input', { bubbles: true }));
          target.dispatchEvent(new win.Event('change', { bubbles: true }));
          target.focus();
          return true;
        }
      } catch (error) {}
    }
    return false;
  }

  function submit() {
    const text = buildPrompt();
    const direct = submitToTavernInput(text);
    state.submitted = true;
    post('submit', { text, direct });
    renderHome();
  }

  function field(key, label, placeholder, textarea = false) {
    const value = state.fields[key] || '';
    return `
      <label class="ew-field ${textarea ? 'wide' : ''}">
        <span>${label}</span>
        ${textarea
          ? `<textarea data-field="${key}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`
          : `<input data-field="${key}" value="${esc(value)}" placeholder="${esc(placeholder)}">`}
      </label>`;
  }

  function renderShell(inner) {
    const app = document.getElementById('app');
    if (!app) return;
    const place = selectedPlace();
    const page = currentPage();
    app.innerHTML = `
      <main class="eldred-welcome" data-build="${BUILD_ID}">
        <section class="ew-frame">
          <header class="ew-title">
            <div>
              <span>ELDRED KINGDOM DOSSIER</span>
              <h1>艾尔德雷德大世界</h1>
              <p>自由开局控制台 / 多阶段角色接入</p>
            </div>
            <div class="ew-seal">E</div>
          </header>

          <section class="ew-board">
            <aside class="ew-side">
              <div class="ew-side-card">
                <b>制作与边界</b>
                <p>开场只负责收集玩家设计、出生点与第一幕方向，不预设救世身份，不写固定开场白。</p>
              </div>
              <nav class="ew-steps">
                ${pages.map((item, index) => `
                  <button class="${state.page === item.id ? 'active' : ''}" data-page="${item.id}">
                    <span>${String(index + 1).padStart(2, '0')}</span>
                    <strong>${item.title}</strong>
                    <small>${item.sub}</small>
                  </button>
                `).join('')}
              </nav>
              <div class="ew-side-card compact">
                <b>${esc(actualPlaceName())}</b>
                <p>${esc(place.region)} / 风险 ${esc(place.risk)} / ${esc(state.tone)}</p>
              </div>
            </aside>

            <section class="ew-stage">
              <header class="ew-stage-head">
                <div>
                  <span>${esc(page.sub)} / ${esc(place.mood)}</span>
                  <h2>${esc(page.title)}</h2>
                </div>
                <div class="ew-fast">
                  <button data-page="origin">地点</button>
                  <button data-page="dossier">档案</button>
                  <button data-page="confirm">预览</button>
                </div>
              </header>
              <section class="ew-content">${inner}</section>
              <footer class="ew-footer">
                <div>
                  <button data-action="sample">填入示例</button>
                  <button data-action="reset">重置</button>
                </div>
                <div>
                  <button data-action="prev" ${pageIndex() === 0 ? 'disabled' : ''}>上一步</button>
                  <button data-action="next" ${pageIndex() === pages.length - 1 ? 'disabled' : ''}>下一步</button>
                  <button class="primary" data-action="submit">${state.submitted ? '已发送' : '发送开局设定'}</button>
                </div>
              </footer>
            </section>
          </section>
        </section>
      </main>`;
    bind(app);
    resizeSoon();
  }

  function coverPage() {
    return `
      <div class="ew-stack">
        <section class="ew-hero">
          <div>
            <span>ADVENTURE OPENING</span>
            <h3>先确定角色从哪里醒来，再让世界按规则回应。</h3>
            <p>这里不是固定开场白。玩家只需要给出角色设计、出生点和眼前麻烦，艾尔德雷德会从文书、委托、地标服务、NPC职责和当地传闻里生成第一幕。</p>
          </div>
          <div class="ew-orbit">
            <i></i><i></i><i></i><i></i>
            <strong>${esc(actualPlaceName())}</strong>
          </div>
        </section>
        <section class="ew-info-grid">
          <article><b>一页一件事</b><p>每一页只处理一个开局维度，避免把所有设定堆在同一屏。</p></article>
          <article><b>玩家先定调</b><p>身份、麻烦、目标可以很普通，世界负责给出可行动的剧情入口。</p></article>
          <article><b>首轮动态生成</b><p>新闻、传闻、委托、在场人物与变量由第一幕剧情同步落地。</p></article>
        </section>
      </div>`;
  }

  function originPage() {
    return `
      <div class="ew-stack">
        <section class="ew-map">
          ${places.slice(0, 5).map((place, index) => `
            <button class="ew-node n${index + 1} ${state.place === place.id ? 'selected' : ''}" data-place="${esc(place.id)}">
              <strong>${esc(place.id)}</strong><span>${esc(place.region)}</span>
            </button>
          `).join('')}
        </section>
        <section class="ew-card-grid">
          ${places.map(place => `
            <article class="ew-card ${state.place === place.id ? 'selected' : ''}" data-place="${esc(place.id)}">
              <div><b>${esc(place.id)}</b><span>${esc(place.mood)}</span></div>
              <p>${esc(place.hook)}</p>
              <small>${esc(place.service)} / 风险 ${esc(place.risk)}</small>
            </article>
          `).join('')}
        </section>
        ${state.place === '自定义出生点' ? field('customPlace', '自定义出生点', '例如：白冠城外一间漏雨旅店') : ''}
      </div>`;
  }

  function identityPage() {
    return `
      <section class="ew-card-grid three">
        ${identities.map(identity => `
          <article class="ew-card ${state.identity === identity[0] ? 'selected' : ''}" data-identity="${esc(identity[0])}">
            <div><b>${esc(identity[0])}</b><span>身份模板</span></div>
            <p>${esc(identity[1])}</p>
          </article>
        `).join('')}
      </section>`;
  }

  function dossierPage() {
    return `
      <section class="ew-form">
        ${field('name', '玩家名', '{{user}}')}
        ${field('goal', '开局目标', '进城、找委托、寻找某人、躲债、调查传闻等')}
        ${field('design', '角色设计', '外貌、性格、擅长什么、不擅长什么；保持可被世界验证', true)}
        ${field('trouble', '当前麻烦', '没有文书、包裹可疑、钱包紧张、被误会、刚从某地逃出来等', true)}
        ${field('note', '补充说明', '不要预设隐藏身份；玩家后续自己揭示的内容写这里', true)}
      </section>`;
  }

  function partyPage() {
    return `
      <div class="ew-stack">
        <section class="ew-card-grid three">
          ${partyModes.map(mode => `
            <article class="ew-card ${state.party === mode[0] ? 'selected' : ''}" data-party="${esc(mode[0])}">
              <div><b>${esc(mode[0])}</b><span>同行边界</span></div>
              <p>${esc(mode[1])}</p>
            </article>
          `).join('')}
        </section>
        <section class="ew-tone-row">
          ${tones.map(tone => `<button class="${state.tone === tone ? 'selected' : ''}" data-tone="${esc(tone)}">${esc(tone)}</button>`).join('')}
        </section>
        <section class="ew-info-grid">
          <article><b>首轮 NPC</b><p>由出生点自然决定。城门开局优先巡逻、登记员、行会窗口和临时委托人。</p></article>
          <article><b>入队边界</b><p>第一幕可以遇到伙伴，但是否入队必须由剧情关系、条件和后续选择共同决定。</p></article>
          <article><b>状态反馈</b><p>在场人物、可回访、可入队、关系立场应在变量与状态栏中同步可见。</p></article>
        </section>
      </div>`;
  }

  function confirmPage() {
    return `
      <div class="ew-stack">
        <section class="ew-summary">
          <div><span>出生点</span><b>${esc(actualPlaceName())}</b></div>
          <div><span>身份</span><b>${esc(state.identity)}</b></div>
          <div><span>同行</span><b>${esc(state.party)}</b></div>
          <div><span>节奏</span><b>${esc(state.tone)}</b></div>
        </section>
        <section class="ew-preview">
          <header><b>将发送给模型的开局设定</b><span>${state.submitted ? '已提交' : '等待确认'}</span></header>
          <pre>${esc(buildPrompt())}</pre>
        </section>
      </div>`;
  }

  function confirmMessagePage(raw) {
    const rows = String(raw || '')
      .split(/\r?\n/)
      .map(line => line.match(/^([^:：]{2,14})[:：]\s*([\s\S]+)$/))
      .filter(Boolean)
      .map(match => [match[1], match[2]])
      .slice(0, 14);
    return `
      <main class="eldred-welcome confirm-only">
        <section class="ew-frame compact-frame">
          <section class="ew-confirm-banner">
            <span>已提交</span>
            <h2>开局设定已写入聊天</h2>
            <p>下一轮正式回复应根据这份设定生成第一幕剧情，并使用 <content> 与 MVU 变量更新格式。</p>
          </section>
          <section class="ew-summary">
            ${rows.map(row => `<div><span>${esc(row[0])}</span><b>${esc(row[1])}</b></div>`).join('')}
          </section>
          <section class="ew-preview"><header><b>设定原文</b></header><pre>${esc(raw)}</pre></section>
        </section>
      </main>`;
  }

  function renderHome() {
    const renderer = {
      cover: coverPage,
      origin: originPage,
      identity: identityPage,
      dossier: dossierPage,
      party: partyPage,
      confirm: confirmPage,
    }[state.page] || coverPage;
    renderShell(renderer());
  }

  function renderConfirm(raw) {
    const app = document.getElementById('app');
    if (!app) return;
    app.innerHTML = confirmMessagePage(raw);
    resizeSoon();
  }

  function bind(app) {
    if (app.dataset.bound === BUILD_ID) return;
    app.dataset.bound = BUILD_ID;
    app.addEventListener('click', event => {
      const target = event.target;
      const page = target.closest?.('[data-page]');
      if (page) {
        state.page = page.dataset.page;
        renderHome();
        return;
      }
      const place = target.closest?.('[data-place]');
      if (place) {
        state.place = place.dataset.place;
        renderHome();
        return;
      }
      const identity = target.closest?.('[data-identity]');
      if (identity) {
        state.identity = identity.dataset.identity;
        renderHome();
        return;
      }
      const party = target.closest?.('[data-party]');
      if (party) {
        state.party = party.dataset.party;
        renderHome();
        return;
      }
      const tone = target.closest?.('[data-tone]');
      if (tone) {
        state.tone = tone.dataset.tone;
        renderHome();
        return;
      }
      const action = target.closest?.('[data-action]')?.dataset.action;
      if (action === 'sample') fillSample();
      if (action === 'reset') reset();
      if (action === 'prev') move(-1);
      if (action === 'next') move(1);
      if (action === 'submit') submit();
    });
    app.addEventListener('input', event => {
      const fieldName = event.target?.dataset?.field;
      if (!fieldName) return;
      state.fields[fieldName] = event.target.value;
      if (state.page === 'confirm') renderHome();
      else resizeSoon();
    });
  }

  function receive(event) {
    const data = event.data || {};
    if (data.source !== 'EldredWelcomeLoader') return;
    if (data.type === 'render') {
      if (data.mode === 'confirm') renderConfirm(data.raw || '');
      else renderHome();
    }
    if (data.type === 'submitted') {
      state.submitted = !!data.ok;
      renderHome();
    }
  }

  function boot() {
    window.addEventListener('message', receive);
    renderHome();
    post('ready');
    resizeSoon();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
